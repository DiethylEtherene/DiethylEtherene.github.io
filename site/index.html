<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Asteria Wang — Design Engineering student exploring design, technology, research, and illustration.">
  <title>Asteria — Portfolio</title>
  <link rel="icon" href="data:,">
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
    }
    body {
      padding: 8px;
      overflow-x: hidden;
      background: #ffffff;
      box-sizing: border-box;
    }
    #portfolio-consolidated .composition-wrap > .desktop-v2 {
      min-height: max(720px, calc(100vh - 16px));
      margin-top: 0;
    }
    @media (max-width: 860px) {

  </style>
</head>
<body>

<div id="portfolio-consolidated">
  <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
    <p class="subtitle">Loading the consolidated portfolio preview…</p>
  </div>
</div>

<script>
  window.addEventListener("load", async () => {
    const host = document.querySelector("#portfolio-consolidated");
    const response = await fetch("/files/desktop-composition-v2.html");
    host.innerHTML = await response.text();
    host.querySelectorAll("script").forEach((script) => script.remove());

    const desktop = host.querySelector(".desktop-v2");
    const introColumn = host.querySelector(".intro-column");
    const introCopy = host.querySelector(".intro-body p");
    const nowNote = host.querySelector(".now-note");
    const dock = host.querySelector(".utility-dock");
    const cubePlaceholder = host.querySelector("#artifact-cube");
    const artifactZone = host.querySelector("#artifact-zone");
    const artifactMeta = host.querySelector(".artifact-meta");
    const composition = host.querySelector(".composition-wrap");

    const asciiLayer = document.createElement("div");
    asciiLayer.className = "ascii-portrait-layer";
    asciiLayer.dataset.asciiReady = "false";
    asciiLayer.setAttribute("aria-hidden", "true");
    asciiLayer.innerHTML = `
      <div class="ascii-central-field">
        <canvas class="ascii-portrait-canvas" aria-hidden="true"></canvas>
        <i class="ascii-scan" aria-hidden="true"></i>
      </div>
      <canvas class="ascii-creature-canvas ascii-manta-canvas" data-creature="manta" aria-hidden="true"></canvas>
      <canvas class="ascii-creature-canvas ascii-jellyfish-canvas" data-creature="jellyfish" aria-hidden="true"></canvas>
    `;
    desktop.prepend(asciiLayer);

    introCopy.textContent = "Design Engineering student at Imperial College London, exploring ideas through design, technology, research, and illustration.";
    nowNote.remove();

    const themePicker = document.createElement("div");
    themePicker.className = "final-theme-picker";
    themePicker.innerHTML = `
      <button type="button" class="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true"><i></i></span>
        <span class="theme-toggle-label">Theme // light</span>
      </button>
    `;
    desktop.appendChild(themePicker);

    const infoCard = document.createElement("section");
    infoCard.className = "profile-card info-card";
    infoCard.innerHTML = `
      <div class="profile-head mono">
        <span>info.card</span>
        <span class="pink">student / 01</span>
      </div>
      <div class="profile-row"><span class="mono">School</span><strong>Imperial College London</strong></div>
      <div class="profile-row"><span class="mono">Course</span><strong>Design Engineering</strong></div>
      <div class="profile-row"><span class="mono">Stage</span><strong>First year</strong></div>
      <div class="profile-row"><span class="mono">Timezone</span><strong>UTC+8</strong></div>
      <div class="profile-row"><span class="mono">Available</span><strong>Open to internships</strong></div>
      <div class="profile-row"><span class="mono">Focus</span><strong>Design · Tech · Research · Art</strong></div>
    `;

    const contactCard = document.createElement("section");
    contactCard.className = "profile-card contact-card-final";
    contactCard.innerHTML = `
      <div class="profile-head mono">
        <span>contact.card</span>
        <span class="pink">● online</span>
      </div>
      <div class="profile-row">
        <span class="mono">Email</span>
        <a href="mailto:Asteria0526@gmail.com">Asteria0526@gmail.com <b>↗</b></a>
      </div>
      <div class="profile-row"><span class="mono">微信</span><strong>IthinkitsAsu</strong></div>
      <div class="profile-row">
        <span class="mono">GitHub</span>
        <a href="https://github.com/DiethylEtherene" target="_blank" rel="noreferrer">@DiethylEtherene <b>↗</b></a>
      </div>
    `;
    introColumn.append(infoCard, contactCard);

    dock.innerHTML = `
      <button type="button">ABOUT</button>
      <button type="button">CV</button>
      <button type="button">SOCIALS</button>
      <button type="button">SETTINGS</button>
    `;

    artifactMeta.innerHTML = `
      Desk_tidy.stl<br>Auto-rotate / drag<br><span class="pink">Open project ↗</span>
      <span class="artifact-mode">
        <button type="button" class="active" data-model-mode="auto">Auto</button>
        <button type="button" data-model-mode="solid">Solid</button>
        <button type="button" data-model-mode="wire">Wire</button>
      </span>
    `;

    const music = document.createElement("div");
    music.className = "music-easter";
    music.innerHTML = `
      <div class="music-inner">
        <button type="button" class="music-face music-front" aria-label="Reveal hidden playlist" aria-hidden="false">
          <span class="mini-disc"><i></i></span>
          <span class="music-question mono">signal_?</span>
        </button>
        <section class="music-face music-back" aria-label="Hidden signal playlist" inert aria-hidden="true">
          <button type="button" class="music-close" aria-label="Close player">&times;</button>
          <div class="album-chip"><span class="album-orbit"></span></div>
          <div class="track-data">
            <span class="music-eyebrow mono pink">NOW.PLAYING / HIDDEN SIGNAL</span>
            <div class="track-heading" aria-live="polite" aria-atomic="true">
              <span class="music-track-position mono">01 / 02</span>
              <strong><span class="music-track-title">Track 01</span> &mdash; <span class="music-track-artist">Ether</span></strong>
            </div>
            <div class="track-progress" aria-hidden="true"><i></i></div>
            <div class="track-controls">
              <button type="button" class="track-prev" aria-label="Previous track">←</button>
              <button type="button" class="play-toggle" aria-label="Play Track 01">▶</button>
              <button type="button" class="track-next" aria-label="Next track">→</button>
              <span class="track-time mono">00:00 / 00:00</span>
            </div>
          </div>
          <audio class="playlist-audio" preload="metadata" hidden></audio>
        </section>
      </div>
    `;
    desktop.appendChild(music);

    const finalStyle = document.createElement("style");
    finalStyle.textContent = `

        --ink: #202936;
        --mint: #c5f2e3;
        --blue: #c8e6ff;
        --pink: #ff2b8d;
        --clean-shadow: rgba(59,76,91,.16);
        --ascii-base: #355a70;
        --ascii-edge: #3c718f;
        --ascii-scan: rgba(53,90,112,.18);
        --ascii-base-alpha: .2;
        --ascii-edge-alpha: .38;
        --ascii-creature-base: #2f718f;
        --ascii-creature-edge: #145e82;
        --ascii-manta-opacity: .74;
        --ascii-jelly-opacity: .66;
        --ascii-panel-surface: #fff;
        min-height: 720px;
        isolation: isolate;
        background:
          radial-gradient(circle at 1px 1px, rgba(32,41,54,.13) 1px, transparent 1.15px),
          #e1edf5;
        background-size: 19px 19px;
        transition: background-color 320ms ease, color 320ms ease, border-color 320ms ease;
      }
      #portfolio-consolidated .ascii-portrait-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        contain: layout paint style;
        transform: translateZ(0);
      }
      #portfolio-consolidated .ascii-central-field {
        position: absolute;
        left: 27%;
        right: 220px;
        top: 42px;
        bottom: 48px;
        overflow: hidden;
      }
      #portfolio-consolidated .ascii-portrait-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #portfolio-consolidated .ascii-creature-canvas {
        position: absolute;
        display: block;
        pointer-events: none;
      }
      #portfolio-consolidated .ascii-manta-canvas {
        left: clamp(120px, 14vw, 230px);
        bottom: -70px;
        width: 560px;
        height: 375px;
        opacity: var(--ascii-manta-opacity);
        -webkit-mask: linear-gradient(to right, #000 0%, #000 48%, transparent 82%);
        mask: linear-gradient(to right, #000 0%, #000 48%, transparent 82%);
        transform: rotate(-4deg);
        transform-origin: center;
      }
      #portfolio-consolidated .ascii-jellyfish-canvas {
        right: clamp(70px, 7vw, 115px);
        top: -42px;
        width: 320px;
        height: 750px;
        opacity: var(--ascii-jelly-opacity);
        -webkit-mask: linear-gradient(to right, transparent 0%, transparent 8%, #000 30%, #000 100%);

        transform: rotate(2deg);
        transform-origin: center;
      }
      #portfolio-consolidated .ascii-scan {
        position: absolute;
        width: 16%;

      #portfolio-consolidated .artifact-zone {
        z-index: 3;
      }

        z-index: 10;
      }
      #portfolio-consolidated .utility-dock {
        z-index: 30;
      }
      #portfolio-consolidated .final-theme-picker {
        position: absolute;
        right: 24px;
        bottom: 16px;
        z-index: 40;
      }
      #portfolio-consolidated .final-theme-picker button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-width: 138px;
        height: 34px;
        border: 1.25px solid #202936;
        padding: 0 12px;
        color: #202936;
        background: rgba(255,255,255,.92);
        box-shadow: 4px 4px 0 rgba(59,76,91,.14);

        text-transform: uppercase;

          background-color 220ms ease,
          border-color 220ms ease,
          box-shadow 240ms ease,
          transform 240ms cubic-bezier(.16,1.3,.36,1);
      }
      #portfolio-consolidated .final-theme-picker button:hover {
        transform: translate(-2px,-2px);
        box-shadow: 6px 6px 0 rgba(59,76,91,.16);
      }
      #portfolio-consolidated .final-theme-picker button:active {
        transform: translate(1px,1px) scale(.98);
        box-shadow: 2px 2px 0 rgba(59,76,91,.14);
      }
      #portfolio-consolidated .theme-toggle-icon {
        width: 24px;
        height: 12px;
        position: relative;
        border: 1px solid #202936;
        border-radius: 10px;
        background: #e1edf5;
        transition: border-color 220ms ease, background-color 220ms ease;
      }
      #portfolio-consolidated .theme-toggle-icon i {
        width: 8px;

        position: absolute;
        left: 1px;
        top: 1px;

          left 280ms cubic-bezier(.16,1.3,.36,1),

          box-shadow 220ms ease;
      }
      #portfolio-consolidated .intro-column {

      #portfolio-consolidated .os-window,
      #portfolio-consolidated .profile-card,
      #portfolio-consolidated .folder,

        box-shadow: 5px 5px 0 var(--clean-shadow);
      }
      #portfolio-consolidated .os-window,
      #portfolio-consolidated .profile-card,
      #portfolio-consolidated .utility-dock {
        background-color: var(--ascii-panel-surface);
      }
      #portfolio-consolidated .os-window {
        flex: 0 0 auto;
        border-width: 1.5px;
      }
      #portfolio-consolidated .window-bar {

      }
      #portfolio-consolidated .window-bar > .mono,

      }
      #portfolio-consolidated .intro-body p {

      }
      #portfolio-consolidated .profile-card {

        border: 1.25px solid var(--ink);
        background: var(--ascii-panel-surface);
      }
      #portfolio-consolidated .profile-head {
        min-height: 28px;
        padding: 0 10px;

        justify-content: space-between;

      }
      #portfolio-consolidated .contact-card-final .profile-head {
        background: var(--mint);
      }
      #portfolio-consolidated .profile-row {
        min-height: 27px;
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;

        padding: 0 10px;
        border-bottom: 1px solid rgba(32,41,54,.22);
      }
      #portfolio-consolidated .contact-card-final .profile-row {

      }
      #portfolio-consolidated .profile-row:last-child {

      }
      #portfolio-consolidated .profile-row .mono {

        color: #667383;
      }
      #portfolio-consolidated .profile-row strong,
      #portfolio-consolidated .profile-row a {
        min-width: 0;

        font-weight: 700;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #portfolio-consolidated .profile-row a b,
      #portfolio-consolidated .profile-row a:hover {
        color: var(--pink);
      }
      #portfolio-consolidated .artifact-zone {
        left: 30%;
        right: 265px;
      }
      #portfolio-consolidated .folder-column {
        right: 34px;
        top: 78px;
        bottom: 72px;
        width: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0;
      }
      #portfolio-consolidated .folder {
        --tilt: 0deg;
        flex: 0 0 auto;
        width: 205px;
        height: 124px;
        border-width: 1.25px;
        transform: rotate(var(--tilt));
      }
      #portfolio-consolidated .folder:before {

        top: -13px;
        height: 13px;
        border-width: 1.25px;
        border-bottom-width: 0;
      }
      #portfolio-consolidated .folder:nth-child(1) { --tilt: 1.8deg; background: #c5f2e3; }

      #portfolio-consolidated .folder:nth-child(3) { --tilt: 1.2deg; background: #c6eaf3; }

      }

        padding: 5px 7px;

      }
      #portfolio-consolidated .artifact-mode button.active {

      }
      #portfolio-consolidated .stl-model-shell {

      }

          drop-shadow(0 16px 18px rgba(32,41,54,.13));

            matrix[1] * modelFitPoints[point] +
            matrix[5] * modelFitPoints[point + 1] +

      silhouetteMesh.scale.setScalar(1.01);
      wireMesh.visible = false;
      silhouetteMesh.visible = false;
      curveMesh.visible = false;
      solidMesh.renderOrder = 1;
      silhouetteMesh.renderOrder = 2;
      curveMesh.renderOrder = 3;
      wireMesh.renderOrder = 4;

      modelRoot = new THREE.Group();
      const fittedScale = 1.104 / Math.max(geometry.boundingSphere.radius, .001);
      modelRoot.scale.setScalar(fittedScale);
      modelWorldRadius = geometry.boundingSphere.radius * fittedScale;
      fitModelCamera();
      modelRoot.add(solidMesh, silhouetteMesh, curveMesh, wireMesh);
      modelScene.add(modelRoot);
      modelShell.dataset.outline = "hybrid";
      modelShell.dataset.curveOutline = "fresnel";
      modelShell.dataset.edgeVisibility = "visible-only";
      modelShell.dataset.lineDepthBias = "surface-offset";
      modelShell.dataset.outlineToneMapping = "disabled";
      modelShell.dataset.lineWeight = "reinforced-halo";
      modelShell.dataset.semanticRegionFloor = String(semanticRegionFloor);
      modelShell.dataset.edgeSegments = String(featureEdges.getAttribute("position").count / 2);
      modelShell.dataset.semanticSegments = String(semanticSegmentCount);
      modelStatus.remove();
      modelShell.dataset.ready = "true";
      updateModelTheme();
    } catch (error) {
      modelShell.dataset.ready = "error";
      modelStatus.textContent = "Model load error";
      console.error("Desk tidy viewer failed to load", error);
    }

    const themeButton = themePicker.querySelector(".theme-toggle");
    const themeLabel = themePicker.querySelector(".theme-toggle-label");
    const applyTheme = (dark) => {
      desktop.classList.toggle("dark-theme", dark);
      themeButton.setAttribute("aria-pressed", String(dark));
      themeButton.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      themeLabel.textContent = dark ? "Theme // dark" : "Theme // light";
      asciiController.setTheme(dark ? "dark" : "light");
      updateModelTheme();
    };
    themeButton.addEventListener("click", () => applyTheme(!desktop.classList.contains("dark-theme")));

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let rx = -18;
    let ry = 32;
    let lastFrame = performance.now();
    let automaticMorph = true;
    let wireState = false;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const modelButtons = [...artifactMeta.querySelectorAll("[data-model-mode]")];

    const paintModel = () => {
      if (!modelRoot || !THREE) return;
      modelRoot.rotation.x = THREE.MathUtils.degToRad(rx);
      modelRoot.rotation.y = THREE.MathUtils.degToRad(ry);
      fitModelCamera();
      modelShell.dataset.rotation = `${rx.toFixed(2)},${ry.toFixed(2)}`;
    };
    const animateModel = (time) => {
      const delta = Math.min(time - lastFrame, 32);
      if (!dragging && !reducedMotion) {
        ry += delta * .012;
        paintModel();
      }
      if (
        solidMaterial &&
        wireMaterial &&
        silhouetteMaterial &&
        curveMaterial &&
        solidMesh &&
        wireMesh &&
        silhouetteMesh &&
        curveMesh
      ) {
        wireMix += (wireTarget - wireMix) * Math.min(1, delta * .0024);
        const surfaceFade = 1 - wireMix;
        solidMaterial.opacity = .02 + .94 * surfaceFade * surfaceFade;
        solidMaterial.depthWrite = true;
        wireMaterial.opacity = wireMix * wireMaxOpacity;
        silhouetteMaterial.opacity = wireMix * silhouetteMaxOpacity;
        curveMaterial.uniforms.outlineOpacity.value = wireMix * curveMaxOpacity;
        wireMesh.visible = wireMix > .008;
        silhouetteMesh.visible = wireMix > .008;
        curveMesh.visible = wireMix > .008;
        modelShell.dataset.lineOpacity = wireMaterial.opacity.toFixed(3);
        modelShell.dataset.surfaceOpacity = solidMaterial.opacity.toFixed(3);
        modelShell.dataset.phase = wireMix >= .5 ? "wire" : "solid";
      }
      lastFrame = time;
      if (modelRenderer && modelScene && modelCamera) {
        modelRenderer.render(modelScene, modelCamera);
      }
      requestAnimationFrame(animateModel);
    };
    artifactZone.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      artifactZone.setPointerCapture(event.pointerId);
    });
    artifactZone.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      ry -= (event.clientX - lastX) * .65;
      rx += (event.clientY - lastY) * .65;
      lastX = event.clientX;
      lastY = event.clientY;
      paintModel();
    });
    artifactZone.addEventListener("pointerup", () => { dragging = false; });
    artifactZone.addEventListener("pointercancel", () => { dragging = false; });
    modelButtons.forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        const mode = button.dataset.modelMode;
        automaticMorph = mode === "auto";
        modelShell.dataset.mode = mode;
        if (mode === "solid") {
          wireState = false;
          wireTarget = 0;
        }
        if (mode === "wire") {
          wireState = true;
          wireTarget = 1;
        }
        modelButtons.forEach((item) => item.classList.toggle("active", item === button));
      });
    });
    window.setInterval(() => {
      if (!automaticMorph) return;
      wireState = !wireState;
      wireTarget = wireState ? 1 : 0;
    }, 6200);
    paintModel();
    requestAnimationFrame(animateModel);

    const musicFront = music.querySelector(".music-front");
    const musicBack = music.querySelector(".music-back");
    const musicClose = music.querySelector(".music-close");
    const focusMusicControl = (element) => {
      try {
        element.focus({ preventScroll: true });
      } catch {
        element.focus();
      }
    };
    const setMusicOpen = (open) => {
      music.classList.toggle("open", open);
      desktop.classList.toggle("music-player-open", open);
      musicFront.inert = open;
      musicFront.setAttribute("aria-hidden", String(open));
      musicBack.inert = !open;
      musicBack.setAttribute("aria-hidden", String(!open));
      focusMusicControl(open ? musicClose : musicFront);
    };
    const { createPlaylistPlayer } = await import("/files/playlist-player.js");
    createPlaylistPlayer({
      root: music,
      onOpenChange: setMusicOpen,
      tracks: [
        { title: "Track 01", artist: "Ether", src: "/files/audio/track-01.mp3" },
        { title: "Track 02", artist: "Ether", src: "/files/audio/track-02.mp3" }
      ]
    });
  }, { once: true });
</script>
</body>
</html>
